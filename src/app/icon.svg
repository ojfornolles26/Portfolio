<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .bg { fill: #060714; rx: 8px; }
    .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1px; rx: 6px; }
    .text {
      fill: #38bdf8;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      font-weight: bold;
      font-style: italic;
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f5f2eb; }
      .card { fill: #ffffff; stroke: #e4dfd5; }
      .text { fill: #2e5a44; }
    }
  </style>
  <rect width="32" height="32" class="bg" />
  <rect x="2" y="2" width="28" height="28" class="card" />
  <text x="16" y="19" text-anchor="middle" dominant-baseline="middle" class="text">OJ.</text>
</svg>
